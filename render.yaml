# Render blueprint - ALTERNATIVA glavnom putu.
#
# Preporuceni nacin postavljanja je vlastiti posluzitelj (deploy/postavi.sh),
# jer se na besplatnom Renderu instanca gasi nakon petnaestak minuta
# neaktivnosti - a dok spava, MQTT pretplata ne stoji i telemetrija se gubi.
#
# Uz OVAJ put frontend i API su na razlicitim domenama, pa
# frontend/src/environments/environment.ts mora imati PUNE adrese umjesto
# relativnih, a CORS_ORIGIN mora pokazivati na domenu frontenda.
#
# Zasto Render, a ne Vercel ili Netlify: backend drzi TRAJNU MQTT pretplatu
# prema ChirpStacku. Serverless platforme pokrecu funkciju po zahtjevu i gase je
# nakon odgovora, pa dugozivuca pretplata na brokera tamo nije moguca. Render
# vrti obican Node proces i ima besplatan PostgreSQL, pa sve troje stane na
# jedan racun.
#
# Postavljanje: Render -> New -> Blueprint -> odaberi ovaj repozitorij.
# Varijable oznacene sa `sync: false` se NE citaju odavde nego se upisuju rucno
# u Render UI - u repozitoriju ne smiju stajati adrese brokera ni popis uredaja.

databases:
  - name: xlamp-ng-db
    databaseName: xlamp_ng
    user: xlamp_ng
    plan: free

services:
  # ── Backend: REST API + Socket.IO + MQTT most ──────────────────────────────
  - type: web
    name: xlamp-ng-api
    runtime: node
    plan: free
    rootDir: backend

    # --include=dev je nuzan: prisma CLI je devDependency, a NODE_ENV=production
    # inace natjera npm da preskoci devDependencies, pa `prisma generate`
    # (postinstall) i `migrate deploy` (build) ostanu bez alata.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start

    # Render gasi instancu koja ne odgovara na ovu rutu.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: xlamp-ng-db
          property: connectionString

      # Render generira tajnu sam - nikad ne zavrsi u repozitoriju.
      - key: JWT_SECRET
        generateValue: true

      # Adresa frontenda; upisuje se nakon sto Render dodijeli URL statickom
      # servisu. Bez tocne vrijednosti CORS blokira i REST i Socket.IO.
      - key: CORS_ORIGIN
        sync: false

      - key: MQTT_BROKER_URL
        sync: false
      - key: MQTT_APPLICATION_ID
        sync: false

      # MORA se razlikovati od lokalnog i od produkcijske platforme: broker
      # izbacuje postojecu vezu kad se spoji drugi klijent s istim ID-em.
      - key: MQTT_CLIENT_ID
        value: xlamp-ng-render

      - key: ALLOWED_DEVEUIS
        sync: false

      # Namjerno ukljuceno na pocetku. Aplikacija je nakon deploya javno
      # dostupna, a naredbe idu stvarnim uredajima - dok se ne provjeri tko sve
      # ima pristup, naredbe se samo zapisuju. Iskljucuje se u Render UI kad se
      # zeli demonstrirati stvarno upravljanje.
      - key: DOWNLINK_DRY_RUN
        value: "true"

      - key: OFFLINE_AFTER_MINUTES
        value: "180"

  # ── Frontend: staticki Angular build ───────────────────────────────────────
  - type: web
    name: xlamp-ng-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser

    # Angular routing je na strani klijenta: osvjezavanje na /lampe/3 bi bez
    # ovoga trazilo datoteku koja ne postoji i vratilo 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
