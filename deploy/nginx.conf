# nginx za X-lamp na jednom posluzitelju.
#
# Sve ide kroz port 80 (odnosno 443 nakon certbota):
#   /api        -> Node backend
#   /socket.io  -> isti backend, ali s Upgrade zaglavljima za websocket
#   sve ostalo  -> staticki Angular build
#
# Zato su frontend i API na ISTOM porijeklu, pa nema CORS-a i adresa API-ja se
# ne mora ugradivati u build.
#
# Kopira se u /etc/nginx/sites-available/xlamp-ng i poveze u sites-enabled.

server {
    listen 80;
    listen [::]:80;

    # Zamijeni svojom domenom ili Azureovim imenom
    # (npr. xlamp-demo.westeurope.cloudapp.azure.com).
    server_name _;

    # Ovdje se kopira Angular build (dist/frontend/browser).
    root /opt/xlamp-ng/frontend-dist;
    index index.html;

    # Excel/JSON uvozi nisu velika, ali zadanih 1 MB zna biti tijesno.
    client_max_body_size 10M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Socket.IO ────────────────────────────────────────────────────────────
    # Upgrade i Connection MORAJU proci, inace websocket rukovanje padne i ziva
    # telemetrija radi samo preko pollinga (ili nikako).
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # Veza stoji otvorena dok nema prometa; zadanih 60 s bi je rezalo i
        # klijent bi se stalno spajao iznova.
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # ── Angular ──────────────────────────────────────────────────────────────
    # Datoteke s hashom u imenu se ne mijenjaju, pa se smiju kesirati dugo.
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Routing je na strani klijenta: osvjezavanje na /lampe/3 mora vratiti
    # index.html, a ne 404, jer ta datoteka na disku ne postoji.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html se NE kesira - inace preglednik nakon novog deploya jos danima
    # trazi stare datoteke s hashom kojih vise nema.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
